name: Release

# Push a tag like v0.2.0 to build Snap-0.2.0.dmg and attach it to a draft release.
# Review the draft on GitHub, then publish it.
#
# Signing and notarization turn on when these repository secrets exist:
#   DEVELOPER_ID_P12_BASE64     Developer ID Application certificate + key, exported as .p12, base64
#   DEVELOPER_ID_P12_PASSWORD   its export password
#   NOTARY_KEY_ID, NOTARY_ISSUER_ID, NOTARY_KEY_P8_BASE64
#                               an App Store Connect API key (Developer role) for notarytool
# Without them the app is ad-hoc signed and the release notes explain how to open it.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      HAS_CERTIFICATE: ${{ secrets.DEVELOPER_ID_P12_BASE64 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The build number is the commit count.
          fetch-depth: 0

      - name: Import Developer ID certificate
        if: env.HAS_CERTIFICATE == 'true'
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          test -n "$IDENTITY"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Set up notarization
        if: env.HAS_CERTIFICATE == 'true' && env.HAS_NOTARY_KEY == 'true'
        env:
          KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials snap-notary \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$KEY_ID" --issuer "$ISSUER_ID"
          echo "NOTARY_PROFILE=snap-notary" >> "$GITHUB_ENV"

      - name: Build disk image
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          VERSION="${GITHUB_REF_NAME#v}" make dmg

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$RUNNER_TEMP/notes.md"
          {
            echo "Download **Snap-$VERSION.dmg**, open it and drag Snap into Applications."
            echo
            if [ -z "${NOTARY_PROFILE:-}" ]; then
              echo "> This build isn't notarized by Apple. The first time, Control-click Snap in Applications"
              echo "> and choose **Open**, then **Open** again. After that it opens normally."
              echo
            fi
            echo "Snap needs Screen Recording permission; it walks you through granting it on first launch."
          } > "$NOTES"
          gh release create "$GITHUB_REF_NAME" "build/Snap-$VERSION.dmg" \
            --draft --title "Snap $VERSION" --notes-file "$NOTES" --generate-notes
